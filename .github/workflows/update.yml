name: Update calendars

on:
  schedule:
    - cron: "23 5 * * *"     # daily, 05:23 UTC
    - cron: "23 17 * * *"    # and 17:23 UTC, to pick up same-day PDF updates and live changes
  workflow_dispatch:          # "Run workflow" button
  push:
    branches: [main]
    paths: ["tfl_closures/**", "requirements.txt", ".github/workflows/update.yml"]

permissions:
  contents: write

concurrency:
  group: update-calendars
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m pytest -q

      - name: Build calendars
        env:
          TFL_APP_KEY: ${{ secrets.TFL_APP_KEY }}   # optional
          PDF_URL: ${{ vars.PDF_URL }}              # optional: pin the PDF if auto-discovery breaks
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          BASE_URL="${BASE_URL_OVERRIDE:-https://${OWNER,,}.github.io/${REPO}}"
          python -m tfl_closures.build --out docs --base-url "$BASE_URL"
        # If the safety checks fail, this step fails, nothing is committed,
        # the previous calendars stay live and GitHub emails you.

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update calendars ($(date -u +%Y-%m-%d))"
            git push
          fi
